<svg xmlns="http://www.w3.org/2000/svg" viewBox="29 -7 273 273" role="img" aria-label="Jordan Marketing Consultants">
  <!--
    Browser tab icon: the JMC block from the supplied logo, squared up.

    The path is the same geometry the header mark uses (components/ui/logo.tsx).
    The viewBox is the block's own bounds widened to a square, so the block
    runs edge to edge horizontally and sits centred with a little air above and
    below rather than being letterboxed by the tab strip.

    The wordmark is part of the same path and falls outside this viewBox, so the
    SVG viewport clips it away.

    The lettering is knocked out of the block, not painted white, which is why
    the dark-theme rule only has to flip one fill: the block goes white and the
    letters pick up the dark tab strip behind them. A near-black square on a
    dark tab strip reads as an empty tab, hence the flip.
  -->
  <style>
    .mark { fill: #050708; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #FFFFFF; }
    }
  </style>
